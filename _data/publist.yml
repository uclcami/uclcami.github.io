    display: European Journal of Radiology (2023)
  highlight: 1

- title: "ssVERDICT: Self-Supervised VERDICT-MRI for Enhanced Prostate Tumour Characterisation"
  image: pub2.png
  description: This study develops a self-supervised machine learning method to fit the VERDICT model for prostate, showing improved performance in comparison to traditional and supervised deep learning methods on both simulated and real patient data. 
  authors: Snigdha Sen, Saurabh Singh, Hayley Pye, Caroline M. Moore, Hayley Whitaker, Shonit Punwani, David Atkinson, Eleftheria Panagiotaki1, and Paddy J.Slator
  link:
    url: https://arxiv.org/abs/2309.06268
    display: 	arXiv:2309.06268 (2023)
  highlight: 1

- title: "Comprehensive Brain Tumour Characterisation with VERDICT-MRI: Evaluation of Cellular and Vascular Measures Validated by Histology"
  image: pub3.png
  description: VERDICT is a diffusion MRI framework for the characterisation of different components of tumours, which has shown diagnostic utility for body cancer. This study extends the VERDICT framework to comprehensively characterise brain tumours. 
  authors: Matteo Figini,Antonella Castellano,Michele Bailo,Marcella Callea, Marcello Cadioli, Marcello Cadioli, Samira Bouyagoub, Marco Palombo, Valentina Pieri, Pietro Mortini, Andrea Falini, Daniel C. Alexander, Mara Cercignani and Eleftheria Panagiotaki
  link:
    url: https://www.mdpi.com/2072-6694/15/9/2490
    display: 	Cancers (2023)
  highlight: 1

- title: "Joint estimation of relaxation and diffusion tissue parameters for prostate cancer with relaxation-VERDICT MRI"
  image: pub4.png
  description: This work presents a biophysical model of diffusion and relaxation MRI for prostate called relaxation VERDICT (rVERDICT). The rVERDICT model allows for  estimation of diffusion and relaxation properties of PCa sensitive enough to discriminate Gleason grades 3+3, 3+4 and larger or equal to 4+3.
  authors: Marco Palombo, Vanya Valindria, Saurabh Singh, Eleni Chiou, Francesco Giganti, Hayley Pye, Hayley C. Whitaker, David Atkinson, Shonit Punwani, Daniel C. Alexander & Eleftheria Panagiotaki 
  link:
    url: https://www.nature.com/articles/s41598-023-30182-1
    display: Nature (2023)
  highlight: 1

- title: "Avoiding Unnecessary Biopsy after Multiparametric Prostate MRI with VERDICT Analysis: The INNOVATE Study"
  image: pub5.jpeg
  description: This study evaluates VERDICT MRI, mpMRI-derived apparent diffusion coefficient (ADC), and prostate-specific antigen density (PSAD) as determinants of clinically significant PCa (csPCa), aiming to reduce the number of invasive procedures taking place.
  authors: Saurabh Singh , Harriet Rogers, Baris Kanber, Joey Clemente, Hayley Pye, Edward W. Johnston, Tom Parry, Alistair Grey, Eoin Dinneen, Greg Shaw, Susan Heavey, Urszula Stopka-Farooqui, Aiman Haider, Alex Freeman, Francesco Giganti, David Atkinson, Caroline M. Moore, Hayley C. Whitaker, Daniel C. Alexander, Eleftheria Panagiotaki, Shonit Punwani
  link:
