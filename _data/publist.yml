- title: "Validating the biological origin of in vivo fractional intracellular volume from VERDICT-MRI in the prostate."
  image: masramon_2025.jpg
  description: This study demonstrates strong correlations between in-vivo VERDICT fIC and histological epithelial fraction and cell density using whole-mount prostatectomy specimens, confirming fIC as a biologically grounded marker of tumour cellularity.
  authors: Marta Masramon, Manju Mathew, Saurabh Singh, Thomy Mertzanidou, Joey Clemente, Adam Retter, Natasha Thorley, Adam Phipps, Thomas Parry, Marianthi-Vasiliki Papoutsaki, Lorna Smith, Francesco Grussu, Veeru Kasivisvanathan, Alistair Grey, Eoin Dinneen, Greg Shaw, Dominic Patel, Lucy Caselton, Caroline M. Moore, David Atkinson, Aiman Haider, Alex Freeman, Daniel C. Alexander, Shonit Punwani, Eleftheria Panagiotaki
  link:
    url: https://www.researchsquare.com/article/rs-7723707/v1
