  highlight: 1
  
- title: "Dual Deep Learning for Renal Tumour Subtyping with VERDICT-MRI"
  image: sen_2025.jpg
  description: This study introduces a dual deep-learning pipeline for renal VERDICT-MRI, showing improved model fitting, significant parameter differences between tumour and normal tissue, and identifying a shortened acquisition protocol for clinical use.
  authors: Snigdha Sen, Lorna Smith, Lucy Caselton, Joey Clemente, Maxine Tran, Shonit Punwani, David Atkinson, Richard L Hesketh, Eleftheria Panagiotaki
  link:
    url: https://arxiv.org/abs/2504.07246
    display: Preprint - arXiv (2025)
  highlight: 1
  
- title: "Prostate MR image quality of apparent diffusion coefficient maps versus fractional intracellular volume maps from VERDICT MRI using the PI-QUAL score and a dedicated Likert scale for artefacts"
  image: pub1.jpg
  description: This study aimed to assess the image quality of apparent diffusion coefficient (ADC) maps derived from conventional diffusion-weighted MRI and fractional intracellular volume maps (FIC) from VERDICT MRI (Vascular, Extracellular, Restricted Diffusion for Cytometry in Tumours) in patients from the INNOVATE trial. 
  authors: Saurabh Singh, Francesco Giganti, Louise Dickinson, Harriet Rogers, Baris Kanber, Joey Clemente, Hayley Pye, Susan Heavey, Urszula Stopka-Farooqui, Edward W. Johnston, Caroline M Moore, Alex Freeman, Hayley C Whitaker, Daniel C Alexander, Eleftheria Panagiotaki, Shonit Punwani
  link:
